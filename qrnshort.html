<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRnShort · QR 코드와 단축 주소</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main>
  <h1>QRnShort</h1>
  <p class="lead">웹 주소를 넣으면 QR 코드와 짧은 주소를 한 번에 만듭니다.</p>

  <div class="card">
    <label for="url">웹 주소(URL)</label>
    <input type="url" id="url" placeholder="https://example.com" value="https://pubmed.ncbi.nlm.nih.gov/">
    <button id="make">QR + 단축 주소 만들기</button>
    <p class="msg" id="msg"></p>
  </div>

  <div class="card">
    <strong>QR 코드</strong>
    <div id="qr"></div>
  </div>

  <div class="card">
    <strong>단축 주소</strong>
    <p class="result" id="short">아직 만들지 않았습니다.</p>
    <button id="copy" hidden>단축 주소 복사</button>
  </div>

  <p>이 페이지는 <a href="url2qr.html">URL2QR(5주차 2교시)</a>에 단축 주소 기능을 더한 것입니다.</p>
  <footer><a href="index.html">처음으로</a> · 단축 주소는 is.gd 서비스를 이용합니다.</footer>
</main>
<script>
// 입력값이 http(s) 주소인지 확인하고, 맞으면 정리된 주소를 돌려준다(아니면 null)
function readUrl() {
  const raw = document.getElementById('url').value.trim();
  try {
    const u = new URL(raw);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
  } catch (e) {
    return null;
  }
}

// 주소를 QR 코드로 그린다(이전 QR은 지우고 새로 그림)
function drawQr(text) {
  const box = document.getElementById('qr');
  box.innerHTML = '';
  new QRCode(box, { text: text, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
}

// is.gd에 JSONP로 단축 주소를 요청한다. 성공하면 짧은 주소, 실패하면 오류로 끝나는 Promise를 돌려준다.
// (JSONP: <script> 태그로 요청하고, 응답이 미리 정해 둔 함수를 호출하는 방식이라 CORS 제한을 받지 않는다)
function shorten(longUrl) {
  return new Promise(function (resolve, reject) {
    const name = 'isgd_' + Date.now();
    const tag = document.createElement('script');
    const timer = setTimeout(function () { cleanup(); reject(new Error('응답 시간이 초과되었습니다.')); }, 10000);
    // 요청이 끝나면 임시 함수·태그·타이머를 치운다
    function cleanup() { clearTimeout(timer); delete window[name]; tag.remove(); }
    window[name] = function (data) {
      cleanup();
      if (data && data.shorturl) resolve(data.shorturl);
      else reject(new Error((data && data.errormessage) || '단축 주소를 만들지 못했습니다.'));
    };
    tag.onerror = function () { cleanup(); reject(new Error('단축 서비스에 연결하지 못했습니다.')); };
    tag.src = 'https://is.gd/create.php?format=json&callback=' + name + '&url=' + encodeURIComponent(longUrl);
    document.head.appendChild(tag);
  });
}

// 버튼을 누르면 주소 검사 → QR 코드 → 단축 주소 순서로 처리한다
function onMake() {
  const msg = document.getElementById('msg');
  const out = document.getElementById('short');
  const copy = document.getElementById('copy');
  const url = readUrl();
  if (!url) { msg.textContent = 'http:// 또는 https://로 시작하는 주소를 넣어 주세요.'; return; }
  msg.textContent = '';
  drawQr(url);
  copy.hidden = true;
  out.textContent = '단축 주소를 만드는 중입니다…';
  shorten(url).then(function (shortUrl) {
    out.innerHTML = '';
    const a = document.createElement('a');
    a.href = shortUrl; a.textContent = shortUrl; a.target = '_blank'; a.rel = 'noopener';
    out.appendChild(a);
    copy.hidden = false;
    copy.onclick = function () { navigator.clipboard.writeText(shortUrl).then(function () { copy.textContent = '복사했습니다'; }); };
    copy.textContent = '단축 주소 복사';
  }).catch(function (err) {
    out.textContent = err.message;
  });
}

document.getElementById('make').addEventListener('click', onMake);
</script>
</body>
</html>
