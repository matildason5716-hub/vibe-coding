<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL2QR · 주소를 QR 코드로</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main>
  <h1>URL2QR</h1>
  <p class="lead">웹 주소를 넣으면 QR 코드로 바꿉니다.</p>

  <div class="card">
    <label for="url">웹 주소(URL)</label>
    <input type="url" id="url" placeholder="https://example.com" value="https://pubmed.ncbi.nlm.nih.gov/">
    <button id="make">QR 코드 만들기</button>
    <p class="msg" id="msg"></p>
  </div>

  <div class="card">
    <div id="qr"></div>
  </div>

  <p>짧은 주소도 함께 필요하면 <a href="qrnshort.html">QRnShort(QR + 단축 주소)</a>로 이동하세요.</p>
  <footer><a href="index.html">처음으로</a></footer>
</main>
<script>
// 입력값이 http(s) 주소인지 확인하고, 맞으면 정리된 주소를 돌려준다(아니면 null)
function readUrl() {
  const raw = document.getElementById('url').value.trim();
  try {
    const u = new URL(raw);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
  } catch (e) {
    return null;
  }
}

// 주소를 QR 코드로 그린다(이전 QR은 지우고 새로 그림)
function drawQr(text) {
  const box = document.getElementById('qr');
  box.innerHTML = '';
  new QRCode(box, { text: text, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
}

// 버튼을 누르면 주소를 검사한 뒤 QR 코드를 만든다
function onMake() {
  const msg = document.getElementById('msg');
  const url = readUrl();
  if (!url) { msg.textContent = 'http:// 또는 https://로 시작하는 주소를 넣어 주세요.'; return; }
  msg.textContent = '';
  drawQr(url);
}

document.getElementById('make').addEventListener('click', onMake);
onMake();
</script>
</body>
</html>
